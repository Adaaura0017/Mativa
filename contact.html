<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mativa - student portfolio and academic planner of Adaora Okalu.">
  <title>Contact | Mativa</title>
  <!-- Google Fonts (optional - the site still works offline with fallback fonts) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;700&display=swap">
  <!-- Our external stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ===== HEADER & NAVIGATION (same on every page) ===== -->
  <header>
    <nav class="container nav-bar">
      <a href="index.html" class="logo">Mat<span>iva</span></a>
      <!-- Hamburger button for mobile screens -->
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Academic Planner</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Page banner -->
    <section class="page-banner">
      <div class="container fade-in">
        <h1>Get in <span>Touch</span></h1>
        <p>Have a question or idea? Send me a message.</p>
      </div>
    </section>

    <section>
      <div class="container" style="max-width:650px">
        <article class="card">
          <!-- novalidate lets our JavaScript handle validation -->
          <form id="contactForm" class="contact-form" novalidate>
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" placeholder="Your full name">
              <span class="error"></span>
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="you@example.com">
              <span class="error"></span>
            </div>
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="08012345678">
              <span class="error"></span>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5" placeholder="Write at least 10 characters"></textarea>
              <span class="error"></span>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
            <div class="success-message" id="successMessage"></div>
          </form>
        </article>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER (same on every page) ===== -->
  <footer>
    <div class="container footer-inner">
      <p>&copy; <span id="year">2026</span> Adaora Okalu &middot; Mativa. All rights reserved.</p>
      <div class="socials">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://x.com" target="_blank" rel="noopener">X</a>
      </div>
    </div>
  </footer>

  <!-- Our JavaScript file (loaded at the end so the page loads first) -->
  <script src="js/script.js"></script>
</body>
</html>
